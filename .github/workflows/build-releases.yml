name: Build platform releases

on:
  workflow_dispatch:
  push:
    tags:
      - "keyboard_simulation_*"

permissions:
  contents: write

jobs:
  windows:
    name: keyboard_simulation_windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pyinstaller
      - name: Build Windows exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name keyboard_simulation_windows keyboard_relay_gui.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: keyboard_simulation_windows
          path: dist/keyboard_simulation_windows.exe

  macos:
    name: keyboard_simulation_macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pyinstaller pynput
      - name: Build macOS app
        run: pyinstaller --noconfirm --clean --windowed --name keyboard_simulation_macos keyboard_relay.py
      - name: Package macOS release
        run: |
          hdiutil create -volname keyboard_simulation_macos -srcfolder dist/keyboard_simulation_macos.app -ov -format UDZO keyboard_simulation_macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: keyboard_simulation_macos
          path: keyboard_simulation_macos.dmg

  linux:
    name: keyboard_simulation_linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install Python dependencies
        run: python -m pip install pyinstaller pynput
      - name: Build Linux executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name keyboard_simulation_linux keyboard_relay.py
      - name: Prepare Linux executable
        run: |
          chmod +x dist/keyboard_simulation_linux
      - uses: actions/upload-artifact@v4
        with:
          name: keyboard_simulation_linux
          path: dist/keyboard_simulation_linux

  android:
    name: keyboard_simulation_android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Build Android APK
        working-directory: android
        run: gradle assembleRelease
      - name: Prepare Android APK
        run: |
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk keyboard_simulation_android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: keyboard_simulation_android
          path: keyboard_simulation_android.apk

  release:
    name: Create GitHub releases
    needs: [windows, macos, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create/update platform releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for item in \
            "windows:keyboard_simulation_windows.exe" \
            "macos:keyboard_simulation_macos.dmg" \
            "linux:keyboard_simulation_linux" \
            "android:keyboard_simulation_android.apk"; do
            os="${item%%:*}"
            asset="${item#*:}"
            name="keyboard_simulation_${os}"
            tag="${name}"
            asset_path="artifacts/${name}/${asset}"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$asset_path" --clobber
            else
              gh release create "$tag" "$asset_path" --title "$name" --notes "Automated ${os} application build for Keyboard Simulation."
            fi
          done
