name: Build platform releases

on:
  workflow_dispatch:
  push:
    tags:
      - "keyboard_simulation_*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows:
    name: keyboard_simulation_windows
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'keyboard_simulation_windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pyinstaller
      - name: Build Windows exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name keyboard_simulation_windows keyboard_relay_gui.pyw
      - name: Create/update Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "keyboard_simulation_windows"
          $asset = "dist/keyboard_simulation_windows.exe"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --title $tag --notes "Windows executable build for Keyboard Simulation."
          }

  macos:
    name: keyboard_simulation_macos
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'keyboard_simulation_macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pyinstaller pynput
      - name: Build macOS app
        run: pyinstaller --noconfirm --clean --windowed --name keyboard_simulation_macos keyboard_relay.py
      - name: Build macOS dmg
        run: hdiutil create -volname keyboard_simulation_macos -srcfolder dist/keyboard_simulation_macos.app -ov -format UDZO keyboard_simulation_macos.dmg
      - name: Create/update macOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="keyboard_simulation_macos"
          asset="keyboard_simulation_macos.dmg"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --title "$tag" --notes "macOS DMG build for Keyboard Simulation."
          fi

  linux:
    name: keyboard_simulation_linux
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'keyboard_simulation_linux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install Python dependencies
        run: python -m pip install pyinstaller pynput
      - name: Build Linux executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name keyboard_simulation_linux keyboard_relay.py
      - name: Prepare Linux executable
        run: chmod +x dist/keyboard_simulation_linux
      - name: Create/update Linux release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="keyboard_simulation_linux"
          asset="dist/keyboard_simulation_linux"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --title "$tag" --notes "Linux executable build for Keyboard Simulation."
          fi

  android:
    name: keyboard_simulation_android
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'keyboard_simulation_android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Build Android APK
        working-directory: android
        run: gradle assembleDebug
      - name: Prepare Android APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk keyboard_simulation_android.apk
      - name: Create/update Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="keyboard_simulation_android"
          asset="keyboard_simulation_android.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --title "$tag" --notes "Android APK build for Keyboard Simulation."
          fi
